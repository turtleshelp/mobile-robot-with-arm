controller_names:
  - arm_controller

arm_controller:
  type: FollowJointTrajectory
  action_ns: follow_joint_trajectory
  default: true
  joints:
    - joint1
    - joint2
    - joint3
    - joint4

# The gripper is driven by an effort group controller
# (/gripper_controller/commands) in simulation, which MoveIt
# cannot execute; the mission commands it directly.
