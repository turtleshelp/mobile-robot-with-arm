# Fixed cameras for recording demo videos (only spawned with record:=true).
# Each camera sits at `position` and looks at `look_at` (world frame, m).
# Frames are saved by Gazebo itself, in simulation time, to
# <record_dir>/<name>/ ; tools/make_demo_video.py turns them into a video.

width: 960
height: 540
update_rate: 10.0        # frames per simulated second

cameras:
  overview:
    position: [0.0, -3.6, 4.2]
    look_at: [0.0, -0.1, 0.0]
    fov: 1.2             # horizontal field of view (rad)

  pickup:                # diagonal front-left of the pickup pedestal
    position: [1.62, -0.95, 0.48]
    look_at: [2.10, -0.30, 0.22]
    fov: 0.85

  drop:                  # diagonal front-right of the drop pedestal
    position: [-1.62, 0.65, 0.48]
    look_at: [-2.10, 0.00, 0.22]
    fov: 0.85
